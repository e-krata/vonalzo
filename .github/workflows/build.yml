name: Build and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "14"

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Install Gradle 6.9
        run: |
          curl -fsSL -o /tmp/gradle-6.9.4-bin.zip https://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          sudo unzip -q /tmp/gradle-6.9.4-bin.zip -d /opt
          echo "/opt/gradle-6.9.4/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ build-essential
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: NPM install
        run: npm install --legacy-peer-deps
        env:
          PYTHON: python3

      - name: Install Ionic CLI and Cordova 9
        run: npm install -g @ionic/cli@6 cordova@9.0.0

      - name: Build Android APK
        env:
          CI: "true"
          ANDROID_NDK_HOME: ""
        run: |
          set -e

          # FirebaseX kihagyása CI-ben (Fabric/Maven 403 + elromló gradle)
          ionic cordova plugin remove cordova-plugin-firebasex --nosave || true
          ionic cordova plugin remove cordova-plugin-androidx --nosave || true
          ionic cordova plugin remove cordova-plugin-androidx-adapter --nosave || true

          ionic cordova platform remove android --confirm --no-interactive || true
          ionic cordova platform add android@8.1.0 --confirm --no-interactive

          # Fabric maradványok csak a fő gradle fájlokból
          for f in platforms/android/build.gradle platforms/android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i '/io\.fabric\.tools/d' "$f" || true
              sed -i '/maven\.fabric\.io/d' "$f" || true
              sed -i '/apply plugin:.*fabric/d' "$f" || true
            fi
          done

          # FirebaseX apply sor kivétele, ha mégis bent maradt
          sed -i '/cordova-plugin-firebasex/d' platforms/android/app/build.gradle || true
          sed -i '/google-services/d' platforms/android/app/build.gradle || true
          sed -i '/google-services/d' platforms/android/build.gradle || true

          ionic build --prod

          ANDROID_WWW="platforms/android/app/src/main/assets/www"
          mkdir -p "$ANDROID_WWW"
          rm -rf "${ANDROID_WWW:?}/"*
          cp -a www/. "$ANDROID_WWW/"

          cd platforms/android
          ls -la

          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 4.10.3
          fi
          chmod +x ./gradlew

          if [ -f local.properties ]; then
            sed -i '/ndk.dir/d' local.properties || true
          fi

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get package version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$v" >> "$GITHUB_ENV"

      - name: List APK output
        run: |
          find platforms/android -name "*.apk" | head -20
          ls -la platforms/android/app/build/outputs/apk/release/ || true

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vonalzo-${{ env.PACKAGE_VERSION }}-release-signed-apk
          path: ${{ env.SIGNED_RELEASE_FILE }}
          if-no-files-found: warn