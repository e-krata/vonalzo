name: Build and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "14"

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Install Android SDK build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          yes | sdkmanager --install "platforms;android-28" "build-tools;28.0.3" "build-tools;29.0.3" || true
          ls -la "$SDK/build-tools/" || true
          # Ha 29.0.3 nincs, próbáljuk még egyszer
          if [ ! -x "$SDK/build-tools/29.0.3/zipalign" ]; then
            yes | sdkmanager --install "build-tools;29.0.3"
          fi
          ls -la "$SDK/build-tools/29.0.3/" || ls -la "$SDK/build-tools/28.0.3/" || true

      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL -o /tmp/gradle-4.10.3-bin.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          sudo unzip -q /tmp/gradle-4.10.3-bin.zip -d /opt
          echo "/opt/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ build-essential
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: NPM install
        run: npm install --legacy-peer-deps
        env:
          PYTHON: python3

      - name: Install Ionic CLI and Cordova 9
        run: npm install -g @ionic/cli@6 cordova@9.0.0

      - name: Build Android APK
        env:
          CI: "true"
          ANDROID_NDK_HOME: ""
        run: |
          set -e

          if [ -f config.xml ]; then
            sed -i '/firebasex/d' config.xml || true
            sed -i '/cordova-plugin-androidx/d' config.xml || true
          fi
          if [ -f package.json ]; then
            python3 -c "
          import json
          p = json.load(open('package.json'))
          deps = p.get('dependencies', {})
          for k in list(deps):
            if 'firebasex' in k or 'cordova-plugin-androidx' in k:
              deps.pop(k, None)
          plugs = p.get('cordova', {}).get('plugins', {})
          for k in list(plugs):
            if 'firebasex' in k or 'androidx' in k:
              plugs.pop(k, None)
          json.dump(p, open('package.json', 'w'), indent=2)
          print('package.json cleaned')
          "
          fi

          ionic cordova platform remove android --confirm --no-interactive || true
          ionic cordova platform add android@8.1.0 --confirm --no-interactive

          if [ -f platforms/android/project.properties ]; then
            sed -i 's/target=.*/target=android-28/' platforms/android/project.properties
          fi
          if [ -f platforms/android/gradle.properties ]; then
            sed -i 's/[0-9]cdvCompileSdkVersion=/\ncdvCompileSdkVersion=/g' platforms/android/gradle.properties || true
            sed -i '/^cdvCompileSdkVersion=/d' platforms/android/gradle.properties || true
            sed -i '/^cdvBuildToolsVersion=/d' platforms/android/gradle.properties || true
            printf '\ncdvCompileSdkVersion=28\ncdvBuildToolsVersion=28.0.3\n' >> platforms/android/gradle.properties
          fi

          for f in platforms/android/build.gradle platforms/android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i '/io\.fabric/d' "$f" || true
            sed -i '/maven\.fabric\.io/d' "$f" || true
            sed -i '/google-services/d' "$f" || true
            sed -i '/firebasex/d' "$f" || true
            sed -i 's/jcenter()/mavenCentral()/g' "$f" || true
          done

          cat > platforms/android/CordovaLib/build.gradle << 'EOF'
          ext {
              apply from: 'cordova.gradle'
              cdvCompileSdkVersion = privateHelpers.getProjectTarget()
              cdvBuildToolsVersion = privateHelpers.findLatestInstalledBuildTools()
          }

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:3.3.0'
              }
          }

          repositories {
              google()
              mavenCentral()
          }

          apply plugin: 'com.android.library'

          android {
              compileSdkVersion cdvCompileSdkVersion
              buildToolsVersion cdvBuildToolsVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  minSdkVersion 19
              }

              sourceSets {
                  main {
                      manifest.srcFile 'AndroidManifest.xml'
                      java.srcDirs = ['src']
                      resources.srcDirs = ['src']
                      aidl.srcDirs = ['src']
                      renderscript.srcDirs = ['src']
                      res.srcDirs = ['res']
                      assets.srcDirs = ['assets']
                  }
              }

              packagingOptions {
                  exclude 'META-INF/LICENSE'
                  exclude 'META-INF/LICENSE.txt'
                  exclude 'META-INF/DEPENDENCIES'
                  exclude 'META-INF/NOTICE'
              }
          }
          EOF
          sed -i 's/^          //' platforms/android/CordovaLib/build.gradle

          ionic build --prod

          ANDROID_WWW="platforms/android/app/src/main/assets/www"
          mkdir -p "$ANDROID_WWW"
          rm -rf "${ANDROID_WWW:?}/"*
          cp -a www/. "$ANDROID_WWW/"

          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > platforms/android/local.properties

          cd platforms/android
          ls -la

          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 4.10.3
          fi
          chmod +x ./gradlew

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-4.10.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
          fi

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get package version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$v" >> "$GITHUB_ENV"

      - name: List APK output
        run: |
          find platforms/android -name "*.apk" | head -20
          ls -la platforms/android/app/build/outputs/apk/release/ || true

      - name: Sign APK (manual zipalign + apksigner)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          # build-tools: 29 ha van, különben 28
          if [ -x "$SDK/build-tools/29.0.3/zipalign" ]; then
            BT="$SDK/build-tools/29.0.3"
          elif [ -x "$SDK/build-tools/28.0.3/zipalign" ]; then
            BT="$SDK/build-tools/28.0.3"
          else
            echo "No zipalign found"; ls -la "$SDK/build-tools/" || true; exit 1
          fi
          echo "Using build-tools: $BT"

          UNSIGNED=$(find platforms/android -name "*-release-unsigned.apk" -o -name "app-release-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Unsigned APK: $UNSIGNED"
          test -f "$UNSIGNED"

          echo "$SIGNING_KEY" | base64 -d > /tmp/keystore.jks
          ALIGNED=/tmp/app-release-aligned.apk
          SIGNED=platforms/android/app/build/outputs/apk/release/app-release-signed.apk
          mkdir -p "$(dirname "$SIGNED")"

          "$BT/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks /tmp/keystore.jks \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BT/apksigner" verify "$SIGNED"
          echo "SIGNED_RELEASE_FILE=$SIGNED" >> "$GITHUB_ENV"
          ls -la "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vonalzo-${{ env.PACKAGE_VERSION }}-release-signed-apk
          path: ${{ env.SIGNED_RELEASE_FILE }}
          if-no-files-found: error