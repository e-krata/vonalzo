name: Build and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "14"

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Install Android SDK platform 28
        run: |
          echo "y" | sdkmanager --install "platforms;android-28" "build-tools;28.0.3" >/tmp/sdkmanager.log 2>&1 || true
          tail -n 20 /tmp/sdkmanager.log || true

      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL -o /tmp/gradle-4.10.3-bin.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          sudo unzip -q /tmp/gradle-4.10.3-bin.zip -d /opt
          echo "/opt/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ build-essential
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: NPM install
        run: npm install --legacy-peer-deps
        env:
          PYTHON: python3

      - name: Install Ionic CLI and Cordova 9
        run: npm install -g @ionic/cli@6 cordova@9.0.0

      - name: Build Android APK
        env:
          CI: "true"
          ANDROID_NDK_HOME: ""
        run: |
          set -e

          # FirebaseX / AndroidX plugin-ek kivevése config-ból is (ne települjön újra)
          if [ -f config.xml ]; then
            sed -i '/firebasex/d' config.xml || true
            sed -i '/cordova-plugin-androidx/d' config.xml || true
          fi
          if [ -f package.json ]; then
            python3 -c "
          import json
          p=json.load(open('package.json'))
          deps=p.get('dependencies',{})
          for k in list(deps):
            if 'firebasex' in k or 'cordova-plugin-androidx' in k:
              deps.pop(k, None)
          cord=p.get('cordova',{})
          plugs=cord.get('plugins',{})
          for k in list(plugs):
            if 'firebasex' in k or 'androidx' in k:
              plugs.pop(k, None)
          json.dump(p, open('package.json','w'), indent=2)
          print('package.json cleaned')
          "
          fi

          ionic cordova platform remove android --confirm --no-interactive || true
          ionic cordova platform add android@8.1.0 --confirm --no-interactive

          # SDK 28 kényszerítése
          if [ -f platforms/android/project.properties ]; then
            sed -i 's/target=.*/target=android-28/' platforms/android/project.properties
          fi
          if [ -f platforms/android/gradle.properties ]; then
            echo "cdvCompileSdkVersion=28" >> platforms/android/gradle.properties
            echo "cdvBuildToolsVersion=28.0.3" >> platforms/android/gradle.properties
          fi

          # Fabric / google-services maradvány
          for f in platforms/android/build.gradle platforms/android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i '/io\.fabric/d' "$f" || true
            sed -i '/maven\.fabric\.io/d' "$f" || true
            sed -i '/google-services/d' "$f" || true
            sed -i '/firebasex/d' "$f" || true
          done

          ionic build --prod

          ANDROID_WWW="platforms/android/app/src/main/assets/www"
          mkdir -p "$ANDROID_WWW"
          rm -rf "${ANDROID_WWW:?}/"*
          cp -a www/. "$ANDROID_WWW/"

          cd platforms/android
          ls -la

          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 4.10.3
          fi
          chmod +x ./gradlew

          # Wrapper is Gradle 4.10.3 legyen
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-4.10.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f local.properties ]; then
            sed -i '/ndk.dir/d' local.properties || true
          fi

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get package version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$v" >> "$GITHUB_ENV"

      - name: List APK output
        run: |
          find platforms/android -name "*.apk" | head -20
          ls -la platforms/android/app/build/outputs/apk/release/ || true

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vonalzo-${{ env.PACKAGE_VERSION }}-release-signed-apk
          path: ${{ env.SIGNED_RELEASE_FILE }}
          if-no-files-found: warn