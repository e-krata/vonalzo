      - name: Build Android APK
        env:
          CI: "true"
          ANDROID_NDK_HOME: ""
        run: |
          set -e

          ionic cordova platform remove android --confirm --no-interactive || true
          ionic cordova platform add android@8.1.0 --confirm --no-interactive

          # Fabric / üres maven repo takarítás
          python3 << 'PY'
          import os, re
          root = "platforms/android"
          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not name.endswith(".gradle"):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      text = f.read()
                  original = text
                  # fabric classpath / apply
                  text = re.sub(r"[^\n]*io\.fabric\.tools[^\n]*\n?", "", text)
                  text = re.sub(r"[^\n]*maven\.fabric\.io[^\n]*\n?", "", text)
                  text = re.sub(r"[^\n]*apply plugin:.*fabric[^\n]*\n?", "", text, flags=re.I)
                  # üres maven { } blokkok
                  text = re.sub(r"maven\s*\{\s*\}", "", text)
                  # üres repositories { } ha csak whitespace maradt
                  text = re.sub(r"repositories\s*\{\s*\}", "repositories {\n    google()\n    jcenter()\n    mavenCentral()\n}", text)
                  if text != original:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)
                      print("patched:", path)
          PY

          # Mutasd a gyanús részt
          sed -n '90,120p' platforms/android/app/build.gradle || true
          sed -n '1,80p' platforms/android/build.gradle || true

          ionic build --prod

          ANDROID_WWW="platforms/android/app/src/main/assets/www"
          mkdir -p "$ANDROID_WWW"
          rm -rf "${ANDROID_WWW:?}/"*
          cp -a www/. "$ANDROID_WWW/"

          cd platforms/android
          ls -la

          # Gradle 4.10.3 wrapper (cordova-android 8)
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 4.10.3
          fi
          chmod +x ./gradlew

          # NDK warning elkerülése
          if [ -f local.properties ]; then
            sed -i '/ndk.dir/d' local.properties || true
          fi

          ./gradlew assembleRelease --no-daemon --stacktrace