name: Build and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  android:
    name: Build for Android
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "14"

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Install Gradle 6.9
        run: |
          curl -fsSL -o /tmp/gradle-6.9.4-bin.zip https://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          sudo unzip -q /tmp/gradle-6.9.4-bin.zip -d /opt
          echo "/opt/gradle-6.9.4/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ build-essential
          sudo ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: NPM install
        run: npm install --legacy-peer-deps
        env:
          PYTHON: python3

      - name: Install Ionic CLI and Cordova
        run: npm install -g @ionic/cli@6 cordova@10

      - name: Add Android platform
        run: |
          npx cordova platform remove android || true
          npx cordova platform add android@8.1.0

      - name: Ionic build (web assets)
        run: ionic build --prod

      - name: Cordova prepare android
        run: npx cordova prepare android

      - name: Remove deprecated Fabric dependency
        run: |
          set -e
          find platforms/android -name "*.gradle" -type f | while read -r f; do
            sed -i '/io\.fabric\.tools/d' "$f" || true
            sed -i '/maven\.fabric\.io/d' "$f" || true
            sed -i "/apply plugin:.*['\"]io\.fabric['\"]/d" "$f" || true
            sed -i "/apply plugin:.*fabric/d" "$f" || true
          done
          grep -R "fabric" platforms/android --include="*.gradle" || echo "No fabric left."

      - name: Cordova build android release
        run: npx cordova build android --release

      - name: Get package version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: platforms/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vonalzo-${{ env.PACKAGE_VERSION }}-release-signed-apk
          path: ${{ env.SIGNED_RELEASE_FILE }}
          if-no-files-found: warn