name: Build Android APK
        env:
          CI: "true"
        run: |
          set -e

          # 1) Platform
          ionic cordova platform remove android --confirm --no-interactive || true
          ionic cordova platform add android@8.1.0 --confirm --no-interactive

          # 2) Fabric kiszedése
          find platforms/android -name "*.gradle" -type f | while read -r f; do
            sed -i '/io\.fabric\.tools/d' "$f" || true
            sed -i '/maven\.fabric\.io/d' "$f" || true
            sed -i "/apply plugin:.*['\"]io\.fabric['\"]/d' "$f" || true
            sed -i "/apply plugin:.*fabric/d" "$f" || true
          done

          # 3) Web build
          ionic build --prod

          # 4) www bemásolása
          ANDROID_WWW="platforms/android/app/src/main/assets/www"
          mkdir -p "$ANDROID_WWW"
          rm -rf "${ANDROID_WWW:?}/"*
          cp -a www/. "$ANDROID_WWW/"

          if [ -f config.xml ]; then
            cp -f config.xml platforms/android/app/src/main/res/xml/config.xml 2>/dev/null || true
            cp -f config.xml platforms/android/res/xml/config.xml 2>/dev/null || true
          fi

          # 5) Gradle wrapper + release build
          cd platforms/android
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing – generating wrapper (Gradle 4.10.3 for cordova-android 8)"
            gradle wrapper --gradle-version 4.10.3
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon